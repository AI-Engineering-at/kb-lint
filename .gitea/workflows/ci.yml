name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: python
    steps:
      - name: checkout (node-free, no JS action)
        run: |
          set -e
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" 2>/dev/null \
            || git remote set-url origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="Authorization: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')" \
            fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: install package + deps
        run: |
          python -m pip install -q --upgrade pip
          if [ -f pyproject.toml ] || [ -f setup.py ]; then pip install -q -e .; fi
          if [ -f requirements.txt ]; then pip install -q -r requirements.txt; fi
          pip install -q pytest
      - name: pytest
        run: python -m pytest -q || [ $? -eq 5 ]
